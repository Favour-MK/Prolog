apiVersion: v1
kind: Service
metadata:
  name: {{ include "proglog.fullname" . }}
  labels: {{- include "proglog.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # pods resolve their own DNS name on startup, before they're ready
  publishNotReadyAddresses: true
  selector: {{- include "proglog.selectorLabels" . | nindent 4 }}
  ports:
    - name: rpc
      port: {{ .Values.rpcPort }}
      targetPort: {{ .Values.rpcPort }}
    - name: serf-tcp
      protocol: TCP
      port: {{ .Values.serfPort }}
      targetPort: {{ .Values.serfPort }}
    - name: serf-udp
      protocol: UDP
      port: {{ .Values.serfPort }}
      targetPort: {{ .Values.serfPort }}
